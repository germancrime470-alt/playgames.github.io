<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Telegram Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            min-height: 100vh;
            transition: background-color 0.2s, color 0.2s;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: background-color 0.2s;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .avatar-placeholder {
            width: 60px;
            height: 60px;
            background-color: var(--tg-theme-button-color, #3390ec);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
            font-weight: bold;
        }

        .details {
            flex: 1;
        }

        .detail-row {
            margin: 8px 0;
            font-size: 0.95rem;
        }

        .detail-label {
            font-weight: 500;
            color: var(--tg-theme-hint-color, #888888);
        }

        .button {
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            width: 100%;
            margin-top: 10px;
        }

        .button:active {
            transform: scale(0.98);
        }

        .button-secondary {
            background-color: transparent;
            border: 1px solid var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-color, #3390ec);
            margin-top: 8px;
        }

        .status {
            margin-top: 15px;
            padding: 12px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            border-radius: 12px;
            font-size: 0.85rem;
            border-left: 3px solid var(--tg-theme-button-color, #3390ec);
        }

        .theme-badge {
            display: inline-block;
            background-color: var(--tg-theme-hint-color, #ccc);
            color: var(--tg-theme-bg-color, #fff);
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 8px;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: var(--tg-theme-hint-color, #888);
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🌟 Mini App</h1>
            <p>Добро пожаловать в Telegram Web App!</p>
        </div>

        <div class="card" id="userCard">
            <div class="user-info">
                <div class="avatar-placeholder" id="avatar">👤</div>
                <div class="details">
                    <div class="detail-row">
                        <span class="detail-label">Имя:</span> <span id="userName">Загрузка...</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">ID:</span> <span id="userId">—</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Тема:</span> <span id="themeName">—</span>
                        <span class="theme-badge" id="themeBadge"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>⚡ Действия</h3>
            <button class="button" id="sendEventBtn">Отправить событие боту</button>
            <button class="button button-secondary" id="closeAppBtn">Закрыть приложение</button>
            <button class="button button-secondary" id="triggerHapticBtn">Виброотклик</button>
        </div>

        <div class="card" id="statusCard">
            <div class="status" id="statusMessage">
                💡 Приложение готово к работе
            </div>
        </div>

        <footer>
            Powered by Telegram WebApp SDK
        </footer>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        
        // Расширяем на весь экран и показываем главную кнопку
        tg.expand();
        tg.ready();

        // Настройка главной кнопки (внизу экрана Telegram)
        tg.MainButton.setText("Подтвердить действие");
        tg.MainButton.show();
        tg.MainButton.onClick(() => {
            sendToBot({ action: "main_button_click", timestamp: Date.now() });
            showStatus("✅ Главная кнопка нажата! Данные отправлены боту.");
            tg.HapticFeedback.impactOccurred("medium");
        });

        // Элементы DOM
        const userNameSpan = document.getElementById('userName');
        const userIdSpan = document.getElementById('userId');
        const themeNameSpan = document.getElementById('themeName');
        const themeBadge = document.getElementById('themeBadge');
        const sendEventBtn = document.getElementById('sendEventBtn');
        const closeAppBtn = document.getElementById('closeAppBtn');
        const triggerHapticBtn = document.getElementById('triggerHapticBtn');
        const statusDiv = document.getElementById('statusMessage');

        // Функция отображения статуса
        function showStatus(msg) {
            statusDiv.innerHTML = `📌 ${msg}`;
            // Вибрация при новом статусе (лёгкая)
            tg.HapticFeedback.notificationOccurred("success");
        }

        // Отправка данных боту через sendData
        function sendToBot(data) {
            try {
                const jsonString = JSON.stringify(data);
                tg.sendData(jsonString);
                console.log("Отправлено боту:", jsonString);
            } catch (err) {
                console.error("Ошибка отправки:", err);
                showStatus("Ошибка отправки. Возможно, бот не ожидает данные.");
            }
        }

        // Получаем данные пользователя из Telegram
        let user = tg.initDataUnsafe?.user;
        let themeParams = tg.themeParams;

        // Заполняем информацию о пользователе
        if (user) {
            let firstName = user.first_name || '';
            let lastName = user.last_name || '';
            let fullName = `${firstName} ${lastName}`.trim() || 'Без имени';
            let userId = user.id || 'неизвестно';
            userNameSpan.textContent = fullName;
            userIdSpan.textContent = userId;
            // Создаём аватар — первая буква имени
            const avatarLetter = fullName.charAt(0).toUpperCase() || '👤';
            document.getElementById('avatar').innerHTML = avatarLetter;
        } else {
            userNameSpan.textContent = 'Тестовый режим (вне Telegram)';
            userIdSpan.textContent = '—';
            document.getElementById('avatar').innerHTML = '🧪';
            showStatus('⚠️ Запуск вне Telegram. Некоторые функции могут работать не полностью.');
        }

        // Определение текущей темы (светлая/тёмная)
        const isDark = tg.colorScheme === 'dark';
        themeNameSpan.textContent = tg.colorScheme === 'dark' ? 'Тёмная' : 'Светлая';
        themeBadge.textContent = tg.colorScheme === 'dark' ? '🌙' : '☀️';
        
        // Применяем CSS переменные из темы Telegram (они уже применены через var(--tg-theme-*))
        // Дополнительно можно записать в корень документа
        const root = document.documentElement;
        root.style.setProperty('--tg-theme-bg-color', themeParams.bg_color || '#ffffff');
        root.style.setProperty('--tg-theme-text-color', themeParams.text_color || '#000000');
        root.style.setProperty('--tg-theme-hint-color', themeParams.hint_color || '#999999');
        root.style.setProperty('--tg-theme-link-color', themeParams.link_color || '#3390ec');
        root.style.setProperty('--tg-theme-button-color', themeParams.button_color || '#3390ec');
        root.style.setProperty('--tg-theme-button-text-color', themeParams.button_text_color || '#ffffff');
        root.style.setProperty('--tg-theme-secondary-bg-color', themeParams.secondary_bg_color || '#f0f0f0');
        
        // Обработчик кнопки "Отправить событие боту"
        sendEventBtn.addEventListener('click', () => {
            const eventData = {
                type: "user_action",
                action: "button_click",
                button: "send_event",
                user_id: user?.id || null,
                timestamp: Date.now(),
                custom: "Привет из мини-приложения!"
            };
            sendToBot(eventData);
            showStatus("Событие отправлено боту! Проверьте консоль или ответ бота.");
            tg.HapticFeedback.impactOccurred("light");
        });

        // Закрыть приложение
        closeAppBtn.addEventListener('click', () => {
            tg.HapticFeedback.impactOccurred("heavy");
            tg.close();
        });

        // Виброотклик
        triggerHapticBtn.addEventListener('click', () => {
            tg.HapticFeedback.impactOccurred("rigid");
            showStatus("Виброотклик (impact rigid)");
        });

        // Дополнительная настройка: показываем приветствие
        showStatus(`Приложение загружено. Платформа: ${tg.platform || 'unknown'}`);

        // Если приложение свёрнуто/развёрнуто, можно отловить событие
        tg.onEvent('viewportChanged', () => {
            console.log("Viewport changed");
        });

        // Уведомляем, что всё готово
        console.log("Telegram Web App инициализирован", tg.initDataUnsafe);
    </script>
</body>
</html>
